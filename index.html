<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{position:relative;width:min(100vw,710px);margin:auto;overflow:hidden;background:#000;min-height:100vh}
.screen{position:absolute;inset:0 auto auto 0;width:100%;transition:transform .38s cubic-bezier(.2,.75,.25,1),opacity .3s ease;transform-origin:50% 20%}
.screen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.profile{position:relative;z-index:1}
.detail{z-index:3;opacity:0;pointer-events:none;transform:translateX(12%) scale(.96)}
.app.open .profile{opacity:.45;transform:translateX(-10%) scale(.96);pointer-events:none}
.app.open .detail{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.open-post{left:0;top:65.5%;width:33.34%;height:21.5%}
.back{left:1%;top:0;width:17%;height:10%}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:-3px;border-radius:8px}
@media(prefers-reduced-motion:reduce){.screen{transition:none}}
</style>
